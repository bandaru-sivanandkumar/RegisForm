<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form49</title>
</head>
<body>
    <h1><center>REGISTRATION FORM</center></h1>
    <center>
        <form>
            <table>
                <tr>
                    <td>First name:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Second name:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Father name:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>DOB:</td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td>Mobile number:</td>
                   <td><select>
                        <option>+91</option>
                        <option>+92</option>
                        <option>+94</option>
                    </select>
                    <input type="number"></td>
                </tr>
                <tr>
                    <td>Mail id:</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>Forgot password?</td>
                    <td><a href="https://www.forgotpassword.org/">click here</a></td>
                </tr>
                <tr>
                    <td>checkbox</td>
                    <td><input type="checkbox">Java
                        <input type="checkbox">CSS
                        <input type="checkbox">HTML
                        <input type="checkbox">React
                    </td>
                </tr>
                <tr>
                    <td>Upload passport size photo:(max size of 50kb)</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>Upload Digital signature:(max size of 10mb)</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>Enter captcha:</td>
                    <td><img src="captcha.webp"></td>
                </tr> 
                <tr>
                    <td>
                        <center>
                        <button>ENTER</button>
                        </center>
                    </td>
                </tr>               
            </table>
        </form>
    </center> 
</body>
</html>
